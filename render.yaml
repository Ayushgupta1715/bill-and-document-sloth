# Render Blueprint Configuration for Bill & Document Sloth
# Best Use of Render ($200 Prize Category)
services:
  - type: web
    name: bill-and-document-sloth
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMMA_MODEL_NAME
        value: gemma-2-2b-it
      - key: SENTRY_DSN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TABPFN_API_KEY
        sync: false
    healthCheckPath: /api/dashboard
